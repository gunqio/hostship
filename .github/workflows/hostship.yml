name: Host-Ship Server Renew

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: 📥 拉取私有仓库
        uses: actions/checkout@v4
        with:
          repository: gunqio/zhiyong
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-repo
          sparse-checkout: |
            hostship.py
            aclclouds.py
          sparse-checkout-cone-mode: false

      - name: 🌐 设置 sing-box 代理转发
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)
          
          # 检测代理是否真的启动了（最多等10秒）
          for i in {1..10}; do
            if curl -s --max-time 2 -x http://127.0.0.1:7890 https://ipinfo.io > /dev/null 2>&1; then
              echo "✅ 代理可用，设置环境变量"
              echo "HTTP_PROXY=http://127.0.0.1:7890" >> $GITHUB_ENV
              echo "HTTPS_PROXY=http://127.0.0.1:7890" >> $GITHUB_ENV
              exit 0
            fi
            sleep 1
          done
          
          echo "⚠️ 代理未启动或不可用，后续将直连"
          # 不写 GITHUB_ENV，Python 就不会走代理

      - name: 🚀 运行续期脚本
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          SERVER_IDS: ${{ secrets.SERVER_IDS }}
          RENEWAL_THRESHOLD_DAYS: ${{ secrets.RENEWAL_THRESHOLD_DAYS }}
        run: python private-repo/hostship.py
