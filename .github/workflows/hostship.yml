name: Host-Ship Server Renew

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: 📥 拉取私有仓库脚本
        uses: actions/checkout@v4
        with:
          repository: gunqio/zhiyong
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-repo
          sparse-checkout: |
            aclclouds.py
          sparse-checkout-cone-mode: false

      - name: 🌐 设置 sing-box 代理转发
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          curl -fsSL -o /tmp/setup_proxy.sh https://main.ssss.nyc.mn/setup_proxy.sh || \
          wget -qO /tmp/setup_proxy.sh https://main.ssss.nyc.mn/setup_proxy.sh
          bash /tmp/setup_proxy.sh
          echo "HTTP_PROXY=http://127.0.0.1:7890" >> $GITHUB_ENV
          echo "HTTPS_PROXY=http://127.0.0.1:7890" >> $GITHUB_ENV
          echo "ALL_PROXY=socks5://127.0.0.1:7891" >> $GITHUB_ENV
          sleep 5

      - name: Run renew script
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          SERVER_IDS: ${{ secrets.SERVER_IDS }}
          HTTP_PROXY: ${{ env.HTTP_PROXY }}
          HTTPS_PROXY: ${{ env.HTTPS_PROXY }}
        run: python hostship.py
