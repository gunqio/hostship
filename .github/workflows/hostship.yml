name: Host-Ship Server Renew

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: 📥 拉取私有仓库
        uses: actions/checkout@v4
        with:
          repository: gunqio/zhiyong
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-repo
          sparse-checkout: |
            hostship.py
            aclclouds.py
          sparse-checkout-cone-mode: false

      - name: 🌐 设置 sing-box 代理转发
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 🚀 运行续期脚本
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          SERVER_IDS: ${{ secrets.SERVER_IDS }}
          HTTP_PROXY: http://127.0.0.1:7890
          HTTPS_PROXY: http://127.0.0.1:7890
        run: python private-repo/hostship.py
